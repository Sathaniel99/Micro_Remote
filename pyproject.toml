[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-remote"
version = "2.0.0"
description = "Streaming de audio en vivo por UDP para redes locales (emisor y receptor)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sathaniel" }]
keywords = ["audio", "udp", "streaming", "tkinter", "lan"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["sounddevice>=0.5.6"]

[project.optional-dependencies]
dev = ["Pillow>=10.0", "pyinstaller>=6.0"]

[project.scripts]
micro-remote = "micro_remote.__main__:main"

[project.gui-scripts]
micro-remote-emisor = "micro_remote.ui.emisor:main"
micro-remote-receptor = "micro_remote.ui.receptor:main"

[tool.setuptools.packages.find]
include = ["micro_remote*"]

[tool.setuptools.package-data]
micro_remote = ["assets/*.ico"]
